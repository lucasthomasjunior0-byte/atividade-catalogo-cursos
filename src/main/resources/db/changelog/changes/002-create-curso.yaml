databaseChangeLog:
  - changeSet:
      id: 002-create-curso
      author: catalogocursos
      comment: Cria a tabela de cursos com instrutor_id obrigatório, ainda sem a chave estrangeira.
      changes:
        - createTable:
            tableName: curso
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_curso
                    nullable: false
              - column:
                  name: titulo
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: carga_horaria
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: nivel
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: instrutor_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE curso ADD CONSTRAINT ck_curso_carga_horaria CHECK (carga_horaria BETWEEN 1 AND 400)
        - sql:
            sql: ALTER TABLE curso ADD CONSTRAINT ck_curso_nivel CHECK (nivel IN ('INICIANTE', 'INTERMEDIARIO', 'AVANCADO'))
      rollback:
        - dropTable:
            tableName: curso
